# The language server. It is the compiler used as a library: every answer it
# gives is one `dreams` worked out.
[package]
license = "MIT OR Apache-2.0"
name = "lucid"
version = "0.1.2"
repository = "https://github.com/dream-mindv2/lucid"
description = "The Dream language server"

[dependencies]
dreams = "../dreams"

# `mind release`: `lucid --version` prints the version from the source too.
[release]
files = ["src/main.dr"]
